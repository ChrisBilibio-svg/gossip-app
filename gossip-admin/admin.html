<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Viddi — Admin</title>
<style>
  :root { --pink:#FF4D9D; --bg:#FFFBF5; --ink:#1A1626; --muted:#7A7290; --line:#F0E6EE; --tea:#14B8A6; --cap:#FB7185; }
  * { box-sizing:border-box; font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
  body { background:var(--bg); color:var(--ink); margin:0; padding:24px; max-width:820px; margin:0 auto; }
  h1 { color:var(--pink); }
  h2 { margin-top:32px; border-bottom:2px solid var(--line); padding-bottom:6px; }
  input, textarea, select, button { font-size:15px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; }
  textarea { width:100%; min-height:64px; }
  label { display:block; font-weight:600; font-size:13px; margin:10px 0 4px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .row > div { flex:1; min-width:120px; }
  button { background:var(--pink); color:#fff; border:none; font-weight:700; cursor:pointer; border-radius:999px; }
  button.ghost { background:#fff; color:var(--pink); border:1px solid var(--pink); }
  button.tea { background:var(--tea); } button.cap { background:var(--cap); }
  button.warn { background:#EF4444; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0; }
  .tag { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:#FEF3C7; color:#B45309; }
  .tag.confirmed { background:#DCFCE7; color:#15803D; } .tag.debunked { background:#FEE2E2; color:#B91C1C; }
  .muted { color:var(--muted); font-size:13px; }
  .hide { display:none; }
  #msg { position:sticky; top:0; padding:8px; color:#15803D; font-weight:700; }
</style>
</head>
<body>
  <h1>Viddi — Painel do Curador</h1>
  <div id="msg"></div>

  <!-- LOGIN -->
  <div id="login">
    <h2>Entrar</h2>
    <p class="muted">Use a conta de curador (e-mail + senha). Salve sua conta no app primeiro, depois marque <code>is_curator=true</code>.</p>
    <div class="row">
      <div><label>E-mail</label><input id="email" type="email" style="width:100%" /></div>
      <div><label>Senha</label><input id="password" type="password" style="width:100%" /></div>
      <div style="flex:0"><label>&nbsp;</label><button onclick="login()">Entrar</button></div>
    </div>
  </div>

  <!-- ADMIN -->
  <div id="admin" class="hide">
    <p class="muted">Logado como <b id="who"></b> · <button class="ghost" onclick="logout()">sair</button></p>

    <h2>Novo mercado</h2>
    <label>Resumo</label>
    <textarea id="summary" placeholder="O mercado pergunta se..."></textarea>
    <div class="row">
      <div><label>Status</label>
        <select id="status" style="width:100%"><option value="speculated">Especulado — mercado aberto</option></select>
      </div>
      <div><label>Hero do dia?</label><select id="hero" style="width:100%"><option value="false">Não</option><option value="true">Sim</option></select></div>
      <div><label>Publicar em</label><input id="publish" type="datetime-local" style="width:100%" /></div>
    </div>
    <div class="row">
      <div><label>Regra de resolução</label>
        <select id="resolutionPolicy" style="width:100%">
          <option value="evidence">Evidência: TEA/CAP só com fontes; sem veredito no prazo = VOID</option>
          <option value="deadline">Prazo "até data X": CAP se não acontecer/confirmar</option>
        </select>
      </div>
      <div><label>Janela resolve-by (opcional; padrão 7 dias)</label><input id="deadline" type="datetime-local" style="width:100%" /></div>
      <div><label>Fontes confiáveis mín.</label><input id="requiredSources" type="number" min="1" max="5" value="2" style="width:100%" /></div>
    </div>
    <div class="row">
      <div><label>Seed TEA 🍵</label><input id="seedTrue" type="number" value="0" style="width:100%" /></div>
      <div><label>Seed CAP 🧢</label><input id="seedFalse" type="number" value="0" style="width:100%" /></div>
      <div><label>Fonte (URL, opcional)</label><input id="source" style="width:100%" /></div>
      <div><label>Categoria</label><input id="category" maxlength="32" placeholder="Celebridades, BBB, Futebol..." style="width:100%" /></div>
    </div>
    <p><button onclick="createRumor()">Criar mercado</button></p>

    <h2>Rascunhos (revisar) 🤖</h2>
    <p class="muted">Puxados automaticamente das fontes. Revise e aprove para irem ao ar.</p>
    <div id="drafts"></div>

    <h2>Mercados no ar</h2>
    <div id="rumors"></div>

    <h2>Moderação</h2>
    <div id="reports"></div>
  </div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const config = window.__VIDDI_ADMIN_CONFIG__ || {};
const SUPABASE_URL = config.supabaseUrl || localStorage.getItem('VIDDI_ADMIN_SUPABASE_URL') || '';
const SUPABASE_KEY = config.supabaseAnonKey || localStorage.getItem('VIDDI_ADMIN_SUPABASE_ANON_KEY') || '';
if (!SUPABASE_URL || !SUPABASE_KEY) {
  throw new Error('Configure window.__VIDDI_ADMIN_CONFIG__ or localStorage Viddi admin Supabase env values before using the admin panel.');
}
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const msg = (t, ok = true) => { const m = $('msg'); m.textContent = t; m.style.color = ok ? '#15803D' : '#B91C1C'; setTimeout(() => (m.textContent = ''), 4000); };
const audit = (action, rumor_id, detail) => sb.from('audit_log').insert({ action, rumor_id, detail });
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const attr = (v) => esc(v);
const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
function sevenDayDeadlineFrom(publishIso) {
  return new Date(new Date(publishIso).getTime() + SEVEN_DAYS_MS).toISOString();
}

function normalizeCategory(value) {
  const category = String(value ?? '').trim();
  if (!category) return null;
  const safeCategory = category.replace(/[<>{}]/g, '');
  if (safeCategory.length < 2 || safeCategory.length > 32 || /javascript:/i.test(safeCategory)) return null;
  return safeCategory;
}

function bindAdminActions(root) {
  root.querySelectorAll('[data-approve-draft-id]').forEach((button) => {
    button.addEventListener('click', () => approveDraft(button.dataset.approveDraftId));
  });
  root.querySelectorAll('[data-edit-rumor-id]').forEach((button) => {
    button.addEventListener('click', () => editRumor(button.dataset.editRumorId, button.dataset.summary || ''));
  });
  root.querySelectorAll('[data-remove-rumor-id]').forEach((button) => {
    button.addEventListener('click', () => removeRumor(button.dataset.removeRumorId));
  });
  root.querySelectorAll('[data-add-evidence-id]').forEach((button) => {
    button.addEventListener('click', () => addEvidence(button.dataset.addEvidenceId, button.dataset.supportsOutcome === 'true'));
  });
  root.querySelectorAll('[data-resolve-rumor-id]').forEach((button) => {
    button.addEventListener('click', () => resolve(button.dataset.resolveRumorId, button.dataset.outcome === 'true'));
  });
  root.querySelectorAll('[data-remove-evidence-id]').forEach((button) => {
    button.addEventListener('click', () => removeEvidence(button.dataset.removeEvidenceId, button.dataset.rumorId));
  });
  root.querySelectorAll('[data-split-source-id]').forEach((button) => {
    button.addEventListener('click', () => splitClusterSource(button.dataset.splitSourceId, button.dataset.rumorId));
  });
  root.querySelectorAll('[data-merge-cluster-id]').forEach((button) => {
    button.addEventListener('click', () => mergeCluster(button.dataset.mergeClusterId));
  });
  root.querySelectorAll('[data-set-update-parent-id]').forEach((button) => {
    button.addEventListener('click', () => setUpdateParent(button.dataset.setUpdateParentId));
  });
  root.querySelectorAll('[data-mod-comment-id]').forEach((button) => {
    button.addEventListener('click', () => modComment(button.dataset.modCommentId, button.dataset.status, button.dataset.reportId));
  });
  root.querySelectorAll('[data-dismiss-report-id]').forEach((button) => {
    button.addEventListener('click', () => dismiss(button.dataset.dismissReportId));
  });
}

window.login = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) return msg(error.message, false);
  boot();
};
window.logout = async () => { await sb.auth.signOut(); location.reload(); };

async function boot() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { $('login').classList.remove('hide'); $('admin').classList.add('hide'); return; }
  const { data: prof } = await sb.from('profiles').select('handle,is_curator').eq('id', user.id).maybeSingle();
  if (!prof?.is_curator) { msg('Essa conta não é curador.', false); $('login').classList.remove('hide'); return; }
  $('login').classList.add('hide'); $('admin').classList.remove('hide');
  $('who').textContent = '@' + (prof.handle ?? user.email);
  loadDrafts(); loadRumors(); loadReports();
}

async function loadDrafts() {
  const { data, error } = await sb.from('rumors').select('*').eq('is_draft', true).order('created_at', { ascending: false }).limit(50);
  if (error) { $('drafts').innerHTML = ''; return; }
  $('drafts').innerHTML = (data || []).map((r) => `
    <div class="card" style="border-color:#FFD43B">
      <span class="tag ${esc(r.status)}">${esc(r.status)}</span>
      <span class="muted"> · ${esc(r.category || 'sem categoria')} · ${esc(r.source_label || 'auto')} · seed ${esc(r.seed_true)}/${esc(r.seed_false)}</span>
      <div style="margin:6px 0">${esc(r.summary)}</div>
      <button class="tea" data-approve-draft-id="${attr(r.id)}">✅ Aprovar (ir ao ar)</button>
      <button class="ghost" data-edit-rumor-id="${attr(r.id)}" data-summary="${attr(r.summary)}">Editar</button>
      <button class="warn" data-remove-rumor-id="${attr(r.id)}">Descartar</button>
    </div>`).join('') || '<p class="muted">Nenhum rascunho. (Rode o ingest ou espere o horário.)</p>';
  bindAdminActions($('drafts'));
}
window.approveDraft = async (id) => {
  const publishAt = new Date().toISOString();
  const { error } = await sb.from('rumors').update({
    is_draft: false,
    publish_at: publishAt,
    status: 'speculated',
    resolution_policy: 'evidence',
    prediction_deadline: sevenDayDeadlineFrom(publishAt),
    required_source_count: 2,
  }).eq('id', id);
  if (error) return msg(error.message, false);
  audit('approve_draft', id, { resolution_policy: 'evidence', prediction_deadline: sevenDayDeadlineFrom(publishAt) }); msg('Aprovado como evidência + resolve-by ✅'); loadDrafts(); loadRumors();
};

window.createRumor = async () => {
  const publish = $('publish').value ? new Date($('publish').value).toISOString() : new Date().toISOString();
  const policy = $('resolutionPolicy').value === 'deadline' ? 'deadline' : 'evidence';
  const deadline = $('deadline').value ? new Date($('deadline').value).toISOString() : null;
  const requiredSources = Math.min(Math.max(parseInt($('requiredSources').value || '2', 10) || 2, 1), 5);
  const payload = {
    summary: $('summary').value.trim(),
    status: 'speculated',
    is_hero: $('hero').value === 'true',
    publish_at: publish,
    resolution_policy: policy,
    prediction_deadline: deadline || sevenDayDeadlineFrom(publish),
    required_source_count: requiredSources,
    seed_true: parseInt($('seedTrue').value || '0', 10),
    seed_false: parseInt($('seedFalse').value || '0', 10),
    source_url: $('source').value.trim() || null,
    category: normalizeCategory($('category').value),
  };
  if (!payload.summary) return msg('Escreve o resumo', false);
  const { data, error } = await sb.from('rumors').insert(payload).select('id').single();
  if (error) return msg(error.message, false);
  audit('create', data.id, { summary: payload.summary, category: payload.category, resolution_policy: payload.resolution_policy, prediction_deadline: payload.prediction_deadline });
  $('summary').value = ''; $('source').value = ''; $('category').value = ''; $('deadline').value = ''; $('resolutionPolicy').value = 'evidence'; $('requiredSources').value = '2';
  msg(policy === 'deadline' ? 'Fofoca criada com prazo CAP ✅' : 'Fofoca criada como evidência + resolve-by ✅'); loadRumors();
};

function evidenceSummary(r) {
  const sources = r.rumor_evidence_sources || [];
  if (!sources.length) return 'nenhuma fonte anexada ainda';
  const tea = sources.filter((s) => s.supports_outcome).length;
  const cap = sources.length - tea;
  return `${tea} fonte(s) pró-TEA · ${cap} fonte(s) pró-CAP`;
}

function evidenceList(r) {
  const sources = r.rumor_evidence_sources || [];
  if (!sources.length) return '';
  return `<div class="muted" style="margin:6px 0">${sources.map((s) => `
    <div>
      ${s.supports_outcome ? '🍵' : '🧢'}
      <a href="${esc(s.source_url)}" target="_blank" rel="noopener noreferrer">${esc(s.source_label || 'fonte')}</a>
      ${s.note ? ` — ${esc(s.note)}` : ''}
      <button class="ghost" data-remove-evidence-id="${attr(s.id)}" data-rumor-id="${attr(r.id)}">remover fonte</button>
      <button class="ghost" data-split-source-id="${attr(s.id)}" data-rumor-id="${attr(r.id)}">separar cluster</button>
    </div>`).join('')}</div>`;
}

function resolutionCopy(r) {
  if (r.resolution_policy === 'deadline' && r.prediction_deadline) {
    return `⏱️ prazo: ${new Date(r.prediction_deadline).toLocaleString('pt-BR')} — CAP se não acontecer/confirmar até lá`;
  }
  if (r.prediction_deadline) {
    return `🔎 evidência até ${new Date(r.prediction_deadline).toLocaleString('pt-BR')} — sem veredito = VOID`;
  }
  return `🔎 evidência: ${r.required_source_count || 2}+ fontes confiáveis`;
}

async function loadRumors() {
  const { data, error } = await sb.from('rumors')
    .select('*, rumor_evidence_sources(id, source_url, source_label, supports_outcome, note)')
    .eq('is_draft', false)
    .order('created_at', { ascending: false })
    .limit(50);
  if (error) return msg(error.message, false);
  $('rumors').innerHTML = (data || []).map((r) => `
    <div class="card">
      <span class="tag ${esc(r.status)}">${esc(r.status)}</span> ${r.is_hero ? '🔥 HERO' : ''}
      <span class="muted"> · ${esc(r.category || 'sem categoria')} · ${esc((r.seed_true || 0) + (r.true_votes || 0))} 🍵 / ${esc((r.seed_false || 0) + (r.false_votes || 0))} 🧢</span>
      <div class="muted">${resolutionCopy(r)}</div>
      ${r.updates_rumor_id ? `<div class="muted">🔁 Atualiza mercado ${esc(r.updates_rumor_id)}</div>` : ''}
      <div class="muted">📎 ${esc(r.source_count ?? (r.rumor_evidence_sources || []).length)} N fontes · ${evidenceSummary(r)}</div>
      ${evidenceList(r)}
      <div style="margin:6px 0">${esc(r.summary)}</div>
      ${r.status === 'speculated' ? `
        <button class="ghost" data-add-evidence-id="${attr(r.id)}" data-supports-outcome="true">+ fonte pró-TEA</button>
        <button class="ghost" data-add-evidence-id="${attr(r.id)}" data-supports-outcome="false">+ fonte pró-CAP</button>
        <button class="ghost" data-merge-cluster-id="${attr(r.id)}">mesclar cluster</button>
        <button class="ghost" data-set-update-parent-id="${attr(r.id)}">marcar como update</button>
        <button class="tea" data-resolve-rumor-id="${attr(r.id)}" data-outcome="true">Resolver: TEA acertou</button>
        <button class="cap" data-resolve-rumor-id="${attr(r.id)}" data-outcome="false">Resolver: CAP acertou</button>` : ''}
      <button class="ghost" data-edit-rumor-id="${attr(r.id)}" data-summary="${attr(r.summary)}">Editar</button>
      <button class="warn" data-remove-rumor-id="${attr(r.id)}">Remover</button>
    </div>`).join('') || '<p class="muted">Nenhuma fofoca ainda.</p>';
  bindAdminActions($('rumors'));
}

window.addEvidence = async (id, supportsOutcome) => {
  const sourceUrl = prompt('URL da fonte confiável:');
  if (!sourceUrl) return;
  let source_url;
  try {
    source_url = new URL(sourceUrl.trim()).toString();
  } catch {
    return msg('URL da fonte inválida', false);
  }
  const source_label = prompt('Nome da fonte (ex.: G1, UOL, LeoDias):') || null;
  const note = prompt('Nota rápida para o curador (opcional):') || null;
  const { error } = await sb.from('rumor_evidence_sources').insert({
    rumor_id: id,
    source_url,
    source_label: source_label?.trim() || null,
    supports_outcome: supportsOutcome,
    note: note?.trim() || null,
  });
  if (error) return msg(error.message, false);
  audit('add_evidence_source', id, { supports_outcome: supportsOutcome, source_label });
  msg('Fonte anexada ✅'); loadRumors();
};

window.removeEvidence = async (sourceId, rumorId) => {
  if (!confirm('Remover essa fonte anexada?')) return;
  const { error } = await sb.from('rumor_evidence_sources').delete().eq('id', sourceId);
  if (error) return msg(error.message, false);
  audit('remove_evidence_source', rumorId, { source_id: sourceId });
  msg('Fonte removida ✅'); loadRumors();
};

window.splitClusterSource = async (sourceId, rumorId) => {
  const { data: source, error: readError } = await sb.from('rumor_evidence_sources').select('*').eq('id', sourceId).maybeSingle();
  if (readError || !source) return msg(readError?.message || 'Fonte não encontrada', false);
  const summary = prompt('Resumo do novo mercado para essa fonte:', source.note?.replace(/^Cluster automático do ingest:\s*/i, '') || 'Nova previsão a partir dessa fonte');
  if (!summary?.trim()) return;
  const publishAt = new Date().toISOString();
  const payload = {
    summary: summary.trim(),
    status: 'speculated',
    is_draft: true,
    publish_at: publishAt,
    resolution_policy: 'evidence',
    prediction_deadline: sevenDayDeadlineFrom(publishAt),
    required_source_count: 2,
    seed_true: 0,
    seed_false: 0,
    source_url: source.source_url,
    source_label: source.source_label,
  };
  const { data: rumor, error: insertError } = await sb.from('rumors').insert(payload).select('id').single();
  if (insertError) return msg(insertError.message, false);
  await sb.from('rumor_evidence_sources').delete().eq('id', sourceId);
  audit('split_cluster_source', rumorId, { source_id: sourceId, new_rumor_id: rumor.id });
  msg('Fonte separada em novo rascunho ✅'); loadRumors(); loadDrafts();
};

window.mergeCluster = async (targetRumorId) => {
  const sourceRumorId = prompt('ID do mercado duplicado para mesclar neste cluster:');
  if (!sourceRumorId) return;
  const { data: sourceRumor, error: readError } = await sb.from('rumors').select('id, source_url, source_label, summary').eq('id', sourceRumorId.trim()).maybeSingle();
  if (readError || !sourceRumor) return msg(readError?.message || 'Mercado duplicado não encontrado', false);
  const { error: insertError } = await sb.from('rumor_evidence_sources').insert({
    rumor_id: targetRumorId,
    source_url: sourceRumor.source_url,
    source_label: sourceRumor.source_label || 'cluster manual',
    supports_outcome: true,
    note: `Mesclado manualmente: ${sourceRumor.summary || sourceRumor.id}`,
  });
  if (insertError) return msg(insertError.message, false);
  const { error: deleteError } = await sb.from('rumors').delete().eq('id', sourceRumor.id);
  if (deleteError) return msg('Fonte anexada, mas não removi duplicado: ' + deleteError.message, false);
  audit('merge_cluster', targetRumorId, { merged_rumor_id: sourceRumor.id });
  msg('Cluster mesclado ✅'); loadRumors();
};

window.setUpdateParent = async (rumorId) => {
  const parentId = prompt('ID do mercado anterior que este item atualiza (vazio para limpar):');
  if (parentId == null) return;
  const cleanParentId = parentId.trim() || null;
  if (cleanParentId === rumorId) return msg('Um mercado não pode atualizar ele mesmo', false);
  const { error } = await sb.from('rumors').update({ updates_rumor_id: cleanParentId }).eq('id', rumorId);
  if (error) return msg(error.message, false);
  audit('set_update_parent', rumorId, { updates_rumor_id: cleanParentId });
  msg(cleanParentId ? 'Atualiza mercado vinculado ✅' : 'Vínculo de update removido ✅'); loadRumors();
};

window.resolve = async (id, outcome) => {
  if (!confirm('Resolver essa fofoca? Isso pontua todos os palpites e não dá pra desfazer.')) return;
  const { error } = await sb.rpc('resolve_rumor_with_evidence', { p_rumor_id: id, p_outcome: outcome });
  if (error) return msg(error.message, false);
  msg('Resolvido ✅'); loadRumors();
};
window.editRumor = async (id, current) => {
  const v = prompt('Novo resumo:', current);
  if (v == null) return;
  const { error } = await sb.from('rumors').update({ summary: v.trim() }).eq('id', id);
  if (error) return msg(error.message, false);
  audit('edit', id, {}); msg('Editado ✅'); loadRumors();
};
window.removeRumor = async (id) => {
  if (!confirm('Remover essa fofoca? (só funciona se ninguém palpitou ainda)')) return;
  const { error } = await sb.from('rumors').delete().eq('id', id);
  if (error) return msg('Não deu pra remover: ' + error.message, false);
  audit('remove', id, {}); msg('Removido ✅'); loadRumors();
};

async function loadReports() {
  const { data, error } = await sb.from('comment_reports')
    .select('id, reason, comment_id, comments(id, body, status, user_id)')
    .eq('resolved', false).order('created_at', { ascending: false }).limit(50);
  if (error) return; // table may not exist on older DBs
  $('reports').innerHTML = (data || []).map((rep) => `
    <div class="card">
      <div class="muted">motivo: ${esc(rep.reason || '—')} · status: ${esc(rep.comments?.status ?? '?')}</div>
      <div style="margin:6px 0">"${esc(rep.comments?.body ?? '(removido)')}"</div>
      <button class="warn" data-mod-comment-id="${attr(rep.comments?.id)}" data-status="hidden" data-report-id="${attr(rep.id)}">Ocultar</button>
      <button class="warn" data-mod-comment-id="${attr(rep.comments?.id)}" data-status="removed" data-report-id="${attr(rep.id)}">Remover</button>
      <button class="ghost" data-dismiss-report-id="${attr(rep.id)}">Dispensar</button>
    </div>`).join('') || '<p class="muted">Fila de moderação vazia 🎉</p>';
  bindAdminActions($('reports'));
}
window.modComment = async (commentId, status, reportId) => {
  await sb.from('comments').update({ status }).eq('id', commentId);
  await sb.from('comment_reports').update({ resolved: true }).eq('id', reportId);
  msg('Feito ✅'); loadReports();
};
window.dismiss = async (reportId) => {
  await sb.from('comment_reports').update({ resolved: true }).eq('id', reportId);
  loadReports();
};

boot();
</script>
</body>
</html>
