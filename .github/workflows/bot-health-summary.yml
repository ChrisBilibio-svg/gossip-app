name: Bot health summary

on:
  schedule:
    - cron: '15 12 * * *' # 12:15 UTC = 09:15 Brasília, after bot jobs
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'Lookback window in hours, 1..168'
        required: false
        default: '24'

permissions:
  contents: read

jobs:
  bot-health-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Print bot health summary
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then echo "::notice::Supabase credentials not configured; skipping this run."; exit 0; fi
          node scripts/bot-health-summary.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_HEALTH_LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || vars.BOT_HEALTH_LOOKBACK_HOURS || '24' }}
